name: Build distributable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows (.exe)
        run: >
          dotnet publish FileExplorer.Desktop -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish Linux (self-contained)
        run: >
          dotnet publish FileExplorer.Desktop -c Release -r linux-x64
          --self-contained -p:PublishTrimmed=true

      - name: Build AppImage
        run: |
          set -euo pipefail
          APPDIR="FileExplorer.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/pixmaps"

          cp -r FileExplorer.Desktop/bin/Release/net10.0/linux-x64/publish/* "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/FileExplorer.Desktop"

          convert FileExplorer/Assets/avalonia-logo.ico -resize 256x256 "$APPDIR/usr/share/pixmaps/FileExplorer.png"
          cp "$APPDIR/usr/share/pixmaps/FileExplorer.png" "$APPDIR/FileExplorer.png"

          {
          echo "[Desktop Entry]"
          echo "Type=Application"
          echo "Name=FileExplorer"
          echo "Exec=FileExplorer.Desktop"
          echo "Icon=FileExplorer"
          echo "Categories=Utility;"
          } > "$APPDIR/usr/share/applications/FileExplorer.desktop"
          cp "$APPDIR/usr/share/applications/FileExplorer.desktop" "$APPDIR/FileExplorer.desktop"

          {
          echo '#!/bin/sh'
          echo 'HERE="$(dirname "$(readlink -f "$0")")"'
          echo 'exec "$HERE/usr/bin/FileExplorer.Desktop" "$@"'
          } > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          # Checksum of the continuous-release asset at the time this workflow was written.
          # AppImageKit's "continuous" tag is a rolling release: if upstream publishes a new
          # build this check will fail closed instead of silently trusting a changed binary —
          # update the digest below after verifying the new build out-of-band.
          echo "b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" FileExplorer-x86_64.AppImage

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileExplorer-windows-x64
          path: FileExplorer.Desktop/bin/Release/net10.0/win-x64/publish/FileExplorer.Desktop.exe

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FileExplorer-linux-x64
          path: FileExplorer-x86_64.AppImage

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            FileExplorer.Desktop/bin/Release/net10.0/win-x64/publish/FileExplorer.Desktop.exe
            FileExplorer-x86_64.AppImage
